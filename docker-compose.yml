name: konform

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        /* i18n: eksik ceviri dizgelerini gorunur kilar. */
        define( 'WP_DEVELOPMENT_MODE', 'plugin' );
    volumes:
      - wp_data:/var/www/html
      - ./plugin/konform:/var/www/html/wp-content/plugins/konform

  # Tek seferlik komutlar icin. Ornek:
  #   docker compose run --rm wpcli plugin list
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ./plugin/konform:/var/www/html/wp-content/plugins/konform
    working_dir: /var/www/html

  # Makinede PHP/Composer kurulu degil; bagimliliklar buradan yonetilir.
  #   docker compose run --rm composer install
  composer:
    image: composer:2
    profiles: ["cli"]
    volumes:
      # Depo kokunun tamami baglanir; phpcs.xml.dist eklenti dizininin disinda.
      - .:/repo
    working_dir: /repo/plugin/konform

volumes:
  db_data:
  wp_data:
